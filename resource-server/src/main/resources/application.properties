# Endpoint de l'API qui valide les JWT à partir du JWKS public.
server.port=${RESOURCE_SERVER_PORT:9001}
resource-server.jwks-uri=${RESOURCE_SERVER_JWKS_URI:http://127.0.0.1:9002/oauth2/jwks}
# Les claims issuer/audience attendus doivent correspondre à ceux émis par l'Authorization Server.
resource-server.issuer=${RESOURCE_SERVER_ISSUER:http://127.0.0.1:9000}
resource-server.audience=${RESOURCE_SERVER_AUDIENCE:portage-api}
