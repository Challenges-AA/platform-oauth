# Port et nom utilisés par le Key Service.
server.port=9002
spring.application.name=key-service
# Évite d'exposer détails d'exception et données de requête dans les erreurs HTTP.
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=16KB
# Répertoire persistant et secrets fournis par l'environnement, sans valeur de repli pour les secrets.
platform.keys.directory=${KEY_SERVICE_DIRECTORY:runtime-keys/key-service}
platform.keys.master-key=${KEY_SERVICE_MASTER_KEY}
platform.keys.signing-secret=${KEY_SERVICE_SIGNING_SECRET}
platform.keys.admin-secret=${KEY_SERVICE_ADMIN_SECRET}
# Rotation quotidienne, conservation des anciennes clés publiques et issuer accepté dans les JWT.
platform.keys.rotation-seconds=86400
platform.keys.retention-seconds=900
platform.keys.issuer=http://127.0.0.1:9000
