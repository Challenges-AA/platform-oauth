# Port HTTP de l'Authorization Server et identités de démonstration.
server.port=9000
spring.application.name=authorization-server
platform.users[0].username=user1
platform.users[0].password=${OAUTH_USER1_PASSWORD}
platform.users[0].subject=subject-1
platform.users[1].username=user2
platform.users[1].password=${OAUTH_USER2_PASSWORD}
platform.users[1].subject=subject-2
platform.users[2].username=user3
platform.users[2].password=${OAUTH_USER3_PASSWORD}
platform.users[2].subject=subject-3
platform.users[3].username=user4
platform.users[3].password=${OAUTH_USER4_PASSWORD}
platform.users[3].subject=subject-4
platform.users[4].username=user5
platform.users[4].password=${OAUTH_USER5_PASSWORD}
platform.users[4].subject=subject-5
# Le client est authentifié séparément de l'utilisateur qui demande un jeton.
platform.client.secret=${OAUTH_CLIENT_SECRET}
# Le signataire est un service distinct ; le même secret signer doit lui être fourni.
platform.signing.url=${KEY_SERVICE_URL:http://127.0.0.1:9002}
platform.signing.secret=${KEY_SERVICE_SIGNING_SECRET}
